[package]
edition = "2024"
name = "we-want-more"
version = "0.1.0"

[dependencies]
evdev = "0.13.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
signal-hook = "0.4.5"
tokio = {version = "1.53.2", features = ["full"]}
windows = {version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
]}
